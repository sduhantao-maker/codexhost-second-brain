<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Second Brain, concept 1 "mainline brain": a brain seen from above whose midline
       fissure is the mainline: reached milestone (white dot), current (amber), planned (ring).
       Colours: tile #3B6EF6 to #1E41B0 (same as the current icon), white, amber #FBBF24. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6EF6"/>
      <stop offset="1" stop-color="#1E41B0"/>
    </linearGradient>
    <!-- White paints the brain; black cuts it back to the tile. -->
    <mask id="brain" maskUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <!-- outline: twelve lobes with rounded creases, sharp notches at the midline -->
      <path fill="#fff" d="M128 60.1A26 26 0 0 1 172.9 61.7A7 7 0 0 0 180.2 65.3A23 23 0 0 1 206.6 92.4A7 7 0 0 0 210.1 99.8A23 23 0 0 1 214.6 136.9A7 7 0 0 0 213.3 145.4A22 22 0 0 1 197.5 177.7A7 7 0 0 0 191.7 183.5A22 22 0 0 1 163.1 200.9A7 7 0 0 0 156.4 202.2A21 21 0 0 1 128 200.7A21 21 0 0 1 99.6 202.2A7 7 0 0 0 92.9 200.9A22 22 0 0 1 64.3 183.5A7 7 0 0 0 58.5 177.7A22 22 0 0 1 42.7 145.4A7 7 0 0 0 41.4 136.9A23 23 0 0 1 45.9 99.8A7 7 0 0 0 49.4 92.4A23 23 0 0 1 75.8 65.3A7 7 0 0 0 83.1 61.7A26 26 0 0 1 128 60.1Z"/>
      <g fill="none" stroke="#000" stroke-width="14" stroke-linecap="round">
        <!-- midline = mainline -->
        <path stroke-width="18" d="M128 40V216"/>
        <!-- folds, mirrored left and right -->
        <path d="M58 104C70 96 84 100 92 92"/>
        <path d="M198 104C186 96 172 100 164 92"/>
        <path d="M60 140C72 134 86 142 96 132"/>
        <path d="M196 140C184 134 170 142 160 132"/>
        <path d="M76 176C86 168 98 172 106 164"/>
        <path d="M180 176C170 168 158 172 150 164"/>
      </g>
      <!-- room for the three milestones on the mainline -->
      <g fill="#000">
        <circle cx="128" cy="84" r="17"/>
        <circle cx="128" cy="128" r="24"/>
        <circle cx="128" cy="172" r="17"/>
      </g>
    </mask>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <rect width="256" height="256" fill="#fff" mask="url(#brain)"/>
  <!-- milestones: reached, current, planned -->
  <circle cx="128" cy="84" r="9.5" fill="#fff"/>
  <circle cx="128" cy="128" r="15.5" fill="#FBBF24"/>
  <circle cx="128" cy="172" r="8" fill="none" stroke="#fff" stroke-width="5"/>
</svg>
