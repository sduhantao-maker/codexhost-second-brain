<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500">
  <!-- 第二大脑怎么工作。示意图配色：蓝色 #3B6EF6 到 #1E41B0、白色、琥珀色 #FBBF24
       （当前里程碑）。文字用系统字体；npm run screenshots 把它画成同名的 PNG（2 倍）。
       示例内容都是虚构的（网店项目 acme/shop-web）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.85">
      <stop offset="0" stop-color="#3B6EF6" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#3B6EF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6EF6"/>
      <stop offset="1" stop-color="#1E41B0"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-10%" width="120%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="lift" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#1E41B0" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1.5 1.5 8.5 5 1.5 8.5" fill="none" stroke="#3B6EF6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; fill: #1f2328; }
    .step { font-size: 13px; font-weight: 600; fill: #1E41B0; }
    .num { font-size: 11px; font-weight: 700; fill: #fff; }
    .h { font-size: 13.5px; font-weight: 600; }
    .c { font-size: 11.5px; fill: #5f6670; }
    .s { font-size: 11px; }
    .w { fill: #fff; }
    .box { fill: #fff; stroke: #0f172a; stroke-opacity: 0.08; }
    .panel { fill: #f4f5f8; }
    .bar { fill: #e1e5ec; }
    .flow { fill: none; stroke: #3B6EF6; stroke-width: 1.7; stroke-linecap: round; }
  </style>

  <rect width="880" height="500" fill="url(#bg)"/>
  <rect width="880" height="500" fill="url(#glow)"/>

  <!-- 1 在对话里工作 -->
  <circle cx="33" cy="28" r="9" fill="url(#tile)"/>
  <text class="num" x="33" y="32" text-anchor="middle">1</text>
  <text class="step" x="49" y="32.5">在对话里工作</text>
  <g transform="translate(24 46)">
    <rect class="box" width="200" height="208" rx="14" filter="url(#card)"/>
    <text x="16" y="27" style="font-size: 12px; font-weight: 600">登录页在手机上错位</text>
    <path d="M0 42H200" stroke="#0f172a" stroke-opacity="0.07"/>
    <rect x="65" y="56" width="123" height="26" rx="13" fill="#eef1f6"/>
    <text class="s" x="77" y="73">按钮在手机上错位了</text>
    <rect class="bar" x="16" y="96" width="168" height="7" rx="3.5"/>
    <rect class="bar" x="16" y="110" width="150" height="7" rx="3.5"/>
    <rect class="bar" x="16" y="124" width="96" height="7" rx="3.5"/>
    <rect x="16" y="140" width="62" height="21" rx="10.5" fill="#3B6EF6" fill-opacity="0.11"/>
    <text class="s" x="27" y="154.5" style="font-weight: 600; fill: #2552d8">PR #42</text>
    <rect x="98" y="172" width="90" height="26" rx="13" fill="#eef1f6"/>
    <text class="s" x="110" y="189">评审意见来了</text>
  </g>

  <path class="flow" d="M232 150H282" marker-end="url(#arrow)"/>

  <!-- 2 每轮回复后，模型写下主线 -->
  <circle cx="299" cy="28" r="9" fill="url(#tile)"/>
  <text class="num" x="299" y="32" text-anchor="middle">2</text>
  <text class="step" x="315" y="32.5">每轮回复后，模型写下主线</text>
  <g transform="translate(290 46)">
    <rect width="276" height="208" rx="18" fill="url(#tile)" filter="url(#lift)"/>
    <text class="w" x="20" y="28" style="font-size: 11px; font-weight: 600; fill-opacity: 0.78; letter-spacing: 0.1em">主线</text>
    <text class="w" x="256" y="28" text-anchor="end" style="font-size: 11.5px; font-weight: 600; fill-opacity: 0.85">◆ 2/4</text>
    <text class="w" x="20" y="54" style="font-size: 15px; font-weight: 600">修复登录页在窄屏下错位</text>
    <rect x="20" y="66" width="68" height="21" rx="10.5" fill="#fff" fill-opacity="0.17"/>
    <text class="w s" x="30" y="80.5">shop-web</text>
    <rect x="94" y="66" width="54" height="21" rx="10.5" fill="#fff" fill-opacity="0.17"/>
    <text class="w s" x="104" y="80.5">登录页</text>
    <rect x="154" y="66" width="58" height="21" rx="10.5" fill="#fff" fill-opacity="0.17"/>
    <text class="w s" x="164" y="80.5">PR #42</text>
    <!-- the mainline: reached, current (amber), planned -->
    <path d="M28 120V139M28 156V176" stroke="#fff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="28" cy="114" r="5.5" fill="#fff"/>
    <text class="w" x="46" y="118.5" style="font-size: 12.5px">提交 PR #42</text>
    <text class="w" x="256" y="118.5" text-anchor="end" style="font-size: 11px; fill-opacity: 0.72">已达成</text>
    <circle cx="28" cy="148" r="8.5" fill="#FBBF24"/>
    <text class="w" x="46" y="152.5" style="font-size: 12.5px; font-weight: 600">处理评审意见</text>
    <text class="w" x="256" y="152.5" text-anchor="end" style="font-size: 11px; font-weight: 600; fill: #FBBF24">当前</text>
    <text class="w" x="46" y="170" style="font-size: 11px; fill-opacity: 0.8">▸ 正在做：回复评审并更新截图</text>
    <circle cx="28" cy="188" r="5.5" fill="none" stroke="#fff" stroke-width="2"/>
    <text class="w" x="46" y="192.5" style="font-size: 12.5px; fill-opacity: 0.75">合并并验证线上</text>
    <text class="w" x="256" y="192.5" text-anchor="end" style="font-size: 11px; fill-opacity: 0.6">计划</text>
  </g>

  <path class="flow" d="M574 150C592 150 590 97 606 97" marker-end="url(#arrow)"/>
  <path class="flow" d="M574 150C592 150 590 205 606 205" marker-end="url(#arrow)"/>

  <!-- 3 随处一眼看到 -->
  <circle cx="621" cy="28" r="9" fill="url(#tile)"/>
  <text class="num" x="621" y="32" text-anchor="middle">3</text>
  <text class="step" x="637" y="32.5">随处一眼看到</text>
  <g transform="translate(614 46)">
    <rect class="box" width="242" height="100" rx="14" filter="url(#card)"/>
    <text class="h" x="16" y="30">侧栏悬停卡片</text>
    <text class="c" x="16" y="53">鼠标停在对话上，</text>
    <text class="c" x="16" y="70">旁边弹出它的主线</text>
    <rect class="panel" x="140" y="16" width="46" height="70" rx="7"/>
    <rect class="bar" x="146" y="25" width="32" height="6" rx="3"/>
    <rect x="143" y="37" width="40" height="15" rx="4.5" fill="#dfe4ec"/>
    <rect x="147" y="42" width="26" height="5" rx="2.5" fill="#9aa3b2"/>
    <rect class="bar" x="146" y="60" width="30" height="6" rx="3"/>
    <rect class="bar" x="146" y="73" width="24" height="6" rx="3"/>
    <rect x="166" y="22" width="62" height="62" rx="8" fill="#fff" stroke="#0f172a" stroke-opacity="0.12" filter="url(#card)"/>
    <rect x="173" y="30" width="44" height="5" rx="2.5" fill="#1f2328" fill-opacity="0.75"/>
    <path d="M178 44V52M178 61V69" stroke="#cfd5de" stroke-width="1.4"/>
    <circle cx="178" cy="42" r="2.8" fill="#15803d"/>
    <rect x="185" y="40" width="34" height="4" rx="2" fill="#c4cad4"/>
    <circle cx="178" cy="56" r="3.6" fill="#3B6EF6"/>
    <rect x="185" y="54" width="30" height="4.5" rx="2.25" fill="#6d7686"/>
    <circle cx="178" cy="73" r="2.8" fill="none" stroke="#9aa3b2" stroke-width="1.3"/>
    <rect x="185" y="71" width="24" height="4" rx="2" fill="#d6dbe3"/>
  </g>
  <g transform="translate(614 154)">
    <rect class="box" width="242" height="100" rx="14" filter="url(#card)"/>
    <text class="h" x="16" y="30">总览页「第二大脑」</text>
    <text class="c" x="16" y="53">所有对话按时间分组，</text>
    <text class="c" x="16" y="70">里程碑和支线任务随手改</text>
    <rect class="panel" x="160" y="16" width="68" height="70" rx="7"/>
    <circle cx="169" cy="31" r="2.8" fill="#3B6EF6"/>
    <rect x="176" y="28.5" width="30" height="5" rx="2.5" fill="#6d7686"/>
    <rect x="211" y="29" width="10" height="4" rx="2" fill="#aab2bf"/>
    <path d="M164 41H224" stroke="#0f172a" stroke-opacity="0.07"/>
    <circle cx="169" cy="51" r="2.8" fill="#f59e0b"/>
    <rect x="176" y="48.5" width="26" height="5" rx="2.5" fill="#6d7686"/>
    <rect x="211" y="49" width="10" height="4" rx="2" fill="#aab2bf"/>
    <path d="M164 61H224" stroke="#0f172a" stroke-opacity="0.07"/>
    <circle cx="169" cy="71" r="2.8" fill="#9aa3b2"/>
    <rect x="176" y="68.5" width="32" height="5" rx="2.5" fill="#6d7686"/>
    <rect x="211" y="69" width="10" height="4" rx="2" fill="#aab2bf"/>
  </g>

  <!-- 这些也替你记着 -->
  <text class="step" x="24" y="290">这些也替你记着</text>
  <path d="M128 285.5H856" stroke="#1E41B0" stroke-opacity="0.15"/>

  <g transform="translate(24 304)">
    <rect class="box" width="264" height="172" rx="14" filter="url(#card)"/>
    <rect class="panel" x="12" y="12" width="240" height="76" rx="10"/>
    <circle cx="27" cy="31" r="3" fill="#3B6EF6"/>
    <text class="s" x="37" y="35" style="font-weight: 600">修复登录页在窄屏下错位</text>
    <text class="s" x="37" y="56" style="fill: #5f6670">⑂ 注册页也有同样的错位</text>
    <rect x="186" y="43" width="56" height="19" rx="5" fill="#2563eb"/>
    <text x="214" y="56.5" text-anchor="middle" style="font-size: 10.5px; font-weight: 500; fill: #fff">开子对话</text>
    <path d="M27 36V72H40" fill="none" stroke="#aab2bf" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="47" cy="72" r="3" fill="#3B6EF6"/>
    <text class="s" x="56" y="76">检查 iPad 横屏（子对话）</text>
    <g transform="translate(16 104)" fill="none" stroke="#3B6EF6" stroke-width="1.6" stroke-linecap="round"><path d="M3.5 2.5V13.5M3.5 9.5C3.5 6 11 7.5 11 3.5"/><circle cx="3.5" cy="2.5" r="1.1" fill="#3B6EF6"/><circle cx="11" cy="3.2" r="1.1" fill="#3B6EF6"/><circle cx="3.5" cy="13.5" r="1.1" fill="#3B6EF6"/></g>
    <text class="h" x="34" y="117">引申问题开成子对话</text>
    <text class="c" x="16" y="139">新问题先记下，从悬停卡片一键开成</text>
    <text class="c" x="16" y="157">子对话，挂在本对话下面</text>
  </g>

  <g transform="translate(308 304)">
    <rect class="box" width="264" height="172" rx="14" filter="url(#card)"/>
    <rect class="panel" x="12" y="12" width="240" height="76" rx="10"/>
    <rect x="104" y="18" width="62" height="23" rx="6.5" fill="#1f1f1f"/>
    <text x="114" y="33.5" style="font-size: 11px; fill: #f5c518">★</text>
    <text x="128" y="34" style="font-size: 11px; font-weight: 600; fill: #fff">收藏</text>
    <rect class="bar" x="26" y="52" width="210" height="7" rx="3.5"/>
    <rect class="bar" x="26" y="68" width="170" height="7" rx="3.5"/>
    <rect x="86" y="48" width="152" height="15" rx="2" fill="#4176e6" fill-opacity="0.24"/>
    <rect x="24" y="64" width="120" height="15" rx="2" fill="#4176e6" fill-opacity="0.24"/>
    <text class="h" x="16" y="117"><tspan style="fill: #f2b200">★</tspan> 收藏值得留下的回复</text>
    <text class="c" x="16" y="139">选中回复里的一段点「★ 收藏」，</text>
    <text class="c" x="16" y="157">在「收藏」页签找回，一点跳回原文</text>
  </g>

  <g transform="translate(592 304)">
    <rect class="box" width="264" height="172" rx="14" filter="url(#card)"/>
    <rect class="panel" x="12" y="12" width="240" height="76" rx="10"/>
    <text x="21" y="36" style="font-size: 12px">🔔</text>
    <rect x="40" y="20" width="200" height="23" rx="6" fill="#fff" stroke="#0f172a" stroke-opacity="0.08"/>
    <text class="s" x="52" y="35.5">升级支付 SDK</text>
    <rect x="40" y="50" width="200" height="28" rx="7" fill="#FBBF24" fill-opacity="0.2"/>
    <text class="s" x="50" y="68"><tspan style="font-weight: 600; fill: #2552d8">PR #45</tspan><tspan style="fill: #8a4b05"> 已合并 · 1 小时前</tspan></text>
    <text class="h" x="16" y="117"><tspan style="font-size: 12.5px">🔔</tspan> PR 与 Issue 新动态</text>
    <text class="c" x="16" y="139">有人评审、合并或评论你的 PR，</text>
    <text class="c" x="16" y="157">提出它的对话行上挂一个 🔔</text>
  </g>
</svg>
